version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: saas_admin
      POSTGRES_PASSWORD: supersecretpassword123
      POSTGRES_DB: saas_db
    volumes:
      - ./postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - saas_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis_cache
    networks:
      - saas_network
    command: redis-server --appendonly yes
    volumes:
      - ./redis:/data

  n8n-main:
    image: n8nio/n8n:latest
    container_name: n8n_main
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=saas_db
      - DB_POSTGRESDB_USER=saas_admin
      - DB_POSTGRESDB_PASSWORD=supersecretpassword123
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - N8N_ENCRYPTION_KEY=master_crypto_seed_must_match_workers_exactly_12345
      - N8N_WEBHOOK_URL=http://localhost:5678
    ports:
      - "5678:5678"
    networks:
      - saas_network
    depends_on:
      - postgres
      - redis

  n8n-worker:
    image: n8nio/n8n:latest
    container_name: n8n_worker_1
    command: worker --concurrency=20
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=saas_db
      - DB_POSTGRESDB_USER=saas_admin
      - DB_POSTGRESDB_PASSWORD=supersecretpassword123
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - N8N_ENCRYPTION_KEY=master_crypto_seed_must_match_workers_exactly_12345
      - N8N_WEBHOOK_RESPONSE_RELAY_SIZE_MAX=64
      - EXECUTIONS_DATA_PRUNE=true
    networks:
      - saas_network
    depends_on:
      - postgres
      - redis

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: evolution_api
    environment:
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=global_evolution_secret_999
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://saas_admin:supersecretpassword123@postgres:5432/evolution_db
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379
      - "CACHE_REDIS_PREFIX_KEY=evo:"
    ports:
      - "8080:8080"
    networks:
      - saas_network
    depends_on:
      - postgres
      - redis

networks:
  saas_network:
    external: true
